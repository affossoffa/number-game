
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숫자 맞히기 게임</title>
  <style>
    body {
      background: #17213a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }
    .game {
      background: #24334d;
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
    }
    input, button {
      padding: 12px;
      margin: 8px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>🎯 숫자 맞히기 게임</h1>
    <p>1부터 100 사이의 숫자를 맞혀보세요!</p>
    <h2 id="count">시도 횟수: 0</h2>
    <input type="number" id="guess" min="1" max="100">
    <button onclick="checkGuess()">확인</button>
    <p id="result">숫자를 입력하세요!</p>
    <button onclick="resetGame()">다시 시작</button>
  </div>

  <script>
    let answer = Math.floor(Math.random() * 100) + 1;
    let count = 0;

    function checkGuess() {
      const input = document.getElementById("guess");
      const value = Number(input.value);
      const result = document.getElementById("result");

      if (input.value.trim() === "" ||
          !Number.isInteger(value) || value < 1 || value > 100) {
        result.textContent = "1부터 100 사이의 정수를 입력하세요.";
        return;
      }

      count++;
      document.getElementById("count").textContent =
        "시도 횟수: " + count;

      if (value === answer) {
        result.textContent = "🎉 정답입니다!";
      } else if (value > answer) {
        result.textContent = "📉 더 작은 숫자!";
      } else {
        result.textContent = "📈 더 큰 숫자!";
      }
    }

    function resetGame() {
      answer = Math.floor(Math.random() * 100) + 1;
      count = 0;
      document.getElementById("count").textContent = "시도 횟수: 0";
      document.getElementById("result").textContent = "새 게임 시작!";
      document.getElementById("guess").value = "";
    }
  </script>
</body>
</html>
